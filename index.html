<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- data-static-meta: for crawlers that do not run JS. main.tsx removes them on boot so each route owns one title + description.
         Keep this head in step with content/site.ts and the Home entry in src/app/routes.ts. -->
    <title data-static-meta>Keon Tabuena | Full-stack developer</title>
    <meta data-static-meta name="description" content="Keon Tabuena, full-stack developer in the Philippines. I build tools clients actually use: YouTube automation, lead research, rate benchmarking." />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The phone bar's mark is the mobile LCP; dark is the default theme, so its mark loads first. -->
    <link rel="preload" href="/images/brand/mark-light-96.webp" as="image" fetchpriority="high" />
    <meta name="theme-color" content="#0d0d0f" />

    <meta property="og:type" content="website" />
    <!-- Link previews: absolute URLs on your domain. Re-render og-image.png with scripts/make-og-image.mjs. -->
    <meta property="og:site_name" content="Keon Tabuena" />
    <meta property="og:url" content="https://chevykt.github.io/" />
    <meta property="og:title" content="Keon Tabuena | Full-stack developer" />
    <meta property="og:description" content="Keon Tabuena, full-stack developer in the Philippines. I build tools clients actually use: YouTube automation, lead research, rate benchmarking." />
    <meta property="og:image" content="https://chevykt.github.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Keon Tabuena, full-stack developer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://chevykt.github.io/og-image.png" />

    <!-- Dark by default; a saved light pick is applied before first paint, so it never flashes dark first.
         Mirrors src/lib/theme.ts. The deploy CSP allows this script by hash: after any edit run npm run csp:check. -->
    <script>
      try {
        if (localStorage.getItem('pv2-theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#efeee9')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
